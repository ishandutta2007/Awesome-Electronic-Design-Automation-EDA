<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Circuit Trace Gradient -->
    <linearGradient id="traceGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#00bbf9" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#9b5de5" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Animated Pulse Gradient -->
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="50%" stop-color="#f72585"/>
      <stop offset="100%" stop-color="#7209b7"/>
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="40%" stop-color="#00bbf9"/>
      <stop offset="80%" stop-color="#fee440"/>
      <stop offset="100%" stop-color="#f72585"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="pcbGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#17223b" stroke-width="0.8" stroke-opacity="0.4"/>
      <circle cx="0" cy="0" r="1.5" fill="#1e293b" />
    </pattern>
  </defs>

  <style>
    .title-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      letter-spacing: 0.2px;
    }
    .pill-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
    }
    @keyframes dashMove {
      to {
        stroke-dashoffset: -200;
      }
    }
    @keyframes pulseOpacity {
      0%, 100% { opacity: 0.2; transform: scale(0.98); }
      50% { opacity: 0.8; transform: scale(1.02); }
    }
    @keyframes chipGlow {
      0%, 100% { stroke-opacity: 0.3; }
      50% { stroke-opacity: 1; filter: drop-shadow(0 0 8px #00f5d4); }
    }
    .circuit-animated {
      stroke-dasharray: 12, 12;
      animation: dashMove 14s linear infinite;
    }
    .circuit-fast {
      stroke-dasharray: 8, 8;
      animation: dashMove 8s linear infinite;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="380" fill="url(#bgGrad)"/>
  <rect width="1200" height="380" fill="url(#pcbGrid)"/>

  <!-- Geometric & Ambient Lighting Behind -->
  <g opacity="0.6">
    <circle cx="200" cy="90" r="140" fill="#00f5d4" opacity="0.06" filter="url(#glow)"/>
    <circle cx="1020" cy="270" r="160" fill="#7209b7" opacity="0.08" filter="url(#glow)"/>
    <circle cx="600" cy="190" r="220" fill="#00bbf9" opacity="0.04" filter="url(#glow)"/>
  </g>

  <!-- PCB Traces (Background Decorative Circuitry) -->
  <g stroke="url(#traceGrad)" stroke-width="2" fill="none" opacity="0.45">
    <!-- Top Left to Center Circuit -->
    <path d="M 0 60 L 180 60 L 260 140 L 420 140" />
    <path d="M 40 0 L 40 120 L 120 200 L 280 200" class="circuit-animated" stroke="#00f5d4" stroke-width="1.8"/>
    <circle cx="420" cy="140" r="4" fill="#00f5d4" />
    <circle cx="280" cy="200" r="4" fill="#00bbf9" />

    <!-- Bottom Left Circuit -->
    <path d="M 0 320 L 140 320 L 220 240 L 360 240" />
    <circle cx="360" cy="240" r="3.5" fill="#f72585"/>

    <!-- Right Side Circuits -->
    <path d="M 1200 80 L 1040 80 L 960 160 L 820 160" class="circuit-animated" stroke="#00bbf9" stroke-width="1.8"/>
    <path d="M 1120 0 L 1120 100 L 1020 200 L 880 200" />
    <path d="M 1200 300 L 1060 300 L 980 220 L 800 220" class="circuit-fast" stroke="#f72585" stroke-width="1.5"/>
    <circle cx="820" cy="160" r="4" fill="#9b5de5"/>
    <circle cx="880" cy="200" r="3.5" fill="#00f5d4"/>
    <circle cx="800" cy="220" r="4" fill="#f72585"/>
  </g>

  <!-- Animated Moving Signal Pulses (Traveling along traces) -->
  <g fill="#00f5d4" filter="url(#subtleGlow)">
    <circle cx="0" cy="0" r="3.5">
      <animateMotion path="M 0 60 L 180 60 L 260 140 L 420 140" dur="5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;1;0" dur="5s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="3.5" fill="#f72585">
      <animateMotion path="M 1200 300 L 1060 300 L 980 220 L 800 220" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;1;0" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="3.5" fill="#fee440">
      <animateMotion path="M 1200 80 L 1040 80 L 960 160 L 820 160" dur="6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;1;0" dur="6s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Stylized IC Chip Silhouette (Subtle in Background) -->
  <g transform="translate(600, 75)" opacity="0.18">
    <rect x="-45" y="-45" width="90" height="90" rx="10" fill="#0d1b2a" stroke="#00f5d4" stroke-width="2"/>
    <!-- IC Pins -->
    <line x1="-30" y1="-55" x2="-30" y2="-45" stroke="#00f5d4" stroke-width="3"/>
    <line x1="-10" y1="-55" x2="-10" y2="-45" stroke="#00f5d4" stroke-width="3"/>
    <line x1="10" y1="-55" x2="10" y2="-45" stroke="#00f5d4" stroke-width="3"/>
    <line x1="30" y1="-55" x2="30" y2="-45" stroke="#00f5d4" stroke-width="3"/>
    <line x1="-30" y1="45" x2="-30" y2="55" stroke="#00f5d4" stroke-width="3"/>
    <line x1="-10" y1="45" x2="-10" y2="55" stroke="#00f5d4" stroke-width="3"/>
    <line x1="10" y1="45" x2="10" y2="55" stroke="#00f5d4" stroke-width="3"/>
    <line x1="30" y1="45" x2="30" y2="55" stroke="#00f5d4" stroke-width="3"/>
    <circle cx="0" cy="0" r="16" fill="none" stroke="#00f5d4" stroke-width="1.5"/>
  </g>

  <!-- Central Foreground Content Box -->
  <g id="foreground-content">
    <!-- Top Category Tag -->
    <g transform="translate(600, 68)">
      <rect x="-140" y="-16" width="280" height="32" rx="16" fill="#132038" stroke="#00f5d4" stroke-opacity="0.4" stroke-width="1.2"/>
      <circle cx="-116" cy="0" r="4.5" fill="#00f5d4">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="-98" y="5" fill="#00f5d4" class="pill-text" font-size="12" letter-spacing="1.5">OPEN HARDWARE &amp; SILICON</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="148" text-anchor="middle" class="title-text" font-size="44" fill="url(#titleGrad)" filter="url(#subtleGlow)">
      ⚡ Awesome EDA Ecosystem
    </text>

    <!-- Subtitle -->
    <text x="600" y="196" text-anchor="middle" class="subtitle-text" font-size="19" fill="#e2e8f0">
      Electronic Design Automation • PCB Layout • SPICE Simulators • Open-Silicon RTL-to-GDSII
    </text>

    <text x="600" y="228" text-anchor="middle" class="subtitle-text" font-size="14.5" fill="#94a3b8">
      Curated index of SaaS cloud platforms and open-source hardware engineering toolchains
    </text>

    <!-- Capability Tags / Pills at Bottom -->
    <g transform="translate(600, 292)">
      <!-- Pill 1: PCB Design -->
      <g transform="translate(-360, 0)">
        <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#111c30" stroke="#38bdf8" stroke-width="1.2"/>
        <text x="0" y="5" text-anchor="middle" fill="#38bdf8" class="pill-text">🖲️ PCB Design</text>
      </g>
      <!-- Pill 2: Circuit Simulation -->
      <g transform="translate(-120, 0)">
        <rect x="-95" y="-18" width="190" height="36" rx="18" fill="#111c30" stroke="#00f5d4" stroke-width="1.2"/>
        <text x="0" y="5" text-anchor="middle" fill="#00f5d4" class="pill-text">⚡ SPICE Simulation</text>
      </g>
      <!-- Pill 3: Open Silicon -->
      <g transform="translate(130, 0)">
        <rect x="-95" y="-18" width="190" height="36" rx="18" fill="#111c30" stroke="#f72585" stroke-width="1.2"/>
        <text x="0" y="5" text-anchor="middle" fill="#f72585" class="pill-text">🔬 Open-Silicon ASIC</text>
      </g>
      <!-- Pill 4: Verilog / VHDL -->
      <g transform="translate(365, 0)">
        <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#111c30" stroke="#fee440" stroke-width="1.2"/>
        <text x="0" y="5" text-anchor="middle" fill="#fee440" class="pill-text">💻 HDL &amp; Synthesis</text>
      </g>
    </g>
  </g>
</svg>
